<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
  <style>
    *{ box-sizing: border-box; }
    body { margin: 0; background: #F5F7F9; color: #0F1720;
           font-family: Archivo, Roboto, "Helvetica Neue", Arial, sans-serif;
           font-size: 15px; line-height: 1.35; -webkit-font-smoothing: antialiased; }
    a { color: #0C6B8F; text-decoration: none; } a:hover { color: #08536F; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.012em; }
    .cap { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; }
    .chip { height: 44px; border-radius: 11px; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 500; background: #FFFFFF; border: 1px solid #DDE3E9; }
    .chip-on { height: 44px; border-radius: 11px; display: flex; align-items: center; justify-content: center;
               font-size: 14px; font-weight: 600; background: #0F1720; color: #FFFFFF; border: 1px solid #0F1720; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #F5F7F9; display: flex; flex-direction: column">

  <div style="height: 44px; flex: none; background: #FFFFFF"></div>

  <div style="flex: none; background: #FFFFFF; border-bottom: 1px solid #DDE3E9; display: flex; align-items: center; padding: 0 8px 0 4px; height: 56px">
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F1720" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
    </div>
    <div style="flex-grow: 1; font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Reportes</div>
  </div>

  <div style="flex-grow: 1; padding: 20px 16px 24px 16px; display: flex; flex-direction: column; gap: 20px">

    <div>
      <div style="font-size: 14px; font-weight: 600; margin-bottom: 8px">Periodo</div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <div class="chip">Hoy</div>
        <div class="chip">Semana</div>
        <div class="chip-on">Mes</div>
        <div class="chip">Otro</div>
      </div>
      <div class="num" style="font-size: 13px; color: #5C6672; margin-top: 9px">Del 1 al 31 de agosto de 2026</div>
    </div>

    <div>
      <div style="font-size: 14px; font-weight: 600; margin-bottom: 8px">Rutas</div>
      <div style="background: #FFFFFF; border: 1px solid #DDE3E9; border-radius: 12px; height: 54px; display: flex; align-items: center; padding: 0 16px; gap: 10px">
        <div style="flex-grow: 1; font-size: 16px">Todas las rutas</div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C6672" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
    </div>

    <!-- Vista previa -->
    <div style="background: #FFFFFF; border: 1px solid #DDE3E9; border-radius: 14px; padding: 16px">
      <div class="cap" style="color: #8A94A1">Lo que va a incluir</div>
      <div style="display: flex; flex-direction: column; margin-top: 12px">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #EDF1F4">
          <div style="font-size: 15px; color: #5C6672">Recaudado</div>
          <div class="num" style="font-size: 16px; font-weight: 700">$ 24.860.000</div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #EDF1F4">
          <div style="font-size: 15px; color: #5C6672">Prestado</div>
          <div class="num" style="font-size: 16px; font-weight: 700">$ 19.400.000</div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #EDF1F4">
          <div style="font-size: 15px; color: #5C6672">Gastos</div>
          <div class="num" style="font-size: 16px; font-weight: 700">$ 720.000</div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #EDF1F4">
          <div style="font-size: 15px; color: #5C6672">Interés cobrado</div>
          <div class="num" style="font-size: 16px; font-weight: 700; color: #12704A">$ 4.180.000</div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 11px 0">
          <div style="font-size: 15px; color: #5C6672">Cierres aprobados</div>
          <div class="num" style="font-size: 16px; font-weight: 700">62 de 62</div>
        </div>
      </div>
    </div>

    <!-- Hojas -->
    <div style="background: #FFFFFF; border: 1px solid #DDE3E9; border-radius: 14px; padding: 16px">
      <div class="cap" style="color: #8A94A1">Hojas del archivo</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px">
        <div style="background: #F5F7F9; border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 500">Pagos</div>
        <div style="background: #F5F7F9; border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 500">Préstamos</div>
        <div style="background: #F5F7F9; border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 500">Gastos</div>
        <div style="background: #F5F7F9; border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 500">Cierres</div>
        <div style="background: #F5F7F9; border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 500">Clientes</div>
      </div>
    </div>

  </div>

  <div style="flex: none; background: #FFFFFF; border-top: 1px solid #DDE3E9; padding: 12px 16px 8px 16px">
    <div style="height: 56px; border-radius: 14px; background: #0C6B8F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 17px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="M7 11l5 5 5-5"></path><path d="M4 20h16"></path></svg>
      Descargar Excel
    </div>
    <div style="height: 12px"></div>
    <div style="display: flex; justify-content: center">
      <div style="width: 130px; height: 4px; border-radius: 2px; background: #0F1720; opacity: 0.25"></div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
