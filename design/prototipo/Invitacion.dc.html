<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
  <style>
    *{ box-sizing: border-box; }
    body { margin: 0; background: #F5F7F9; color: #0F1720;
           font-family: Archivo, Roboto, "Helvetica Neue", Arial, sans-serif;
           font-size: 15px; line-height: 1.35; -webkit-font-smoothing: antialiased; }
    a { color: #0C6B8F; text-decoration: none; } a:hover { color: #08536F; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.012em; }
    .cap { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; }
    .q { fill: #0F1720; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #F5F7F9; display: flex; flex-direction: column">

  <div style="height: 44px; flex: none; background: #FFFFFF"></div>

  <div style="flex: none; background: #FFFFFF; border-bottom: 1px solid #DDE3E9; display: flex; align-items: center; padding: 0 8px 0 4px; height: 56px">
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F1720" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>
    </div>
    <div style="flex-grow: 1; font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Invitar cobrador</div>
  </div>

  <div style="flex-grow: 1; padding: 20px 16px 24px 16px; display: flex; flex-direction: column; gap: 16px">

    <!-- Lo que entrega la invitación -->
    <div style="background: #FFFFFF; border: 1px solid #DDE3E9; border-radius: 14px; padding: 16px">
      <div class="cap" style="color: #8A94A1">Entra como</div>
      <div style="display: flex; flex-direction: column; margin-top: 8px">
        <div style="display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid #EDF1F4">
          <div style="flex-grow: 1; font-size: 15px; color: #5C6672">Rol</div>
          <div style="font-size: 15px; font-weight: 600">Cobrador</div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid #EDF1F4">
          <div style="flex-grow: 1; font-size: 15px; color: #5C6672">Ruta asignada</div>
          <div style="display: flex; align-items: center; gap: 7px">
            <div style="font-size: 15px; font-weight: 600">Ruta Sur</div>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5C6672" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 13px 0">
          <div style="flex-grow: 1; font-size: 15px; color: #5C6672">El código vence</div>
          <div class="num" style="font-size: 15px; font-weight: 600">en 3 días</div>
        </div>
      </div>
    </div>

    <!-- Código -->
    <div style="background: #FFFFFF; border: 1px solid #DDE3E9; border-radius: 14px; padding: 24px 16px; display: flex; flex-direction: column; align-items: center">
      <div style="background: #FFFFFF; border: 1px solid #EDF1F4; border-radius: 14px; padding: 12px">
        <svg width="160" height="160" viewBox="0 0 25 25" shape-rendering="crispEdges" role="img" aria-label="Código QR de la invitación">
          <rect width="25" height="25" fill="#FFFFFF"></rect>
          <path class="q" d="M0 0h7v7H0zM2 2h3v3H2zM18 0h7v7h-7zM20 2h3v3h-3zM0 18h7v7H0zM2 20h3v3H2z"></path>
          <path class="q" d="M9 0h1v2H9zM11 0h2v1h-2zM14 1h1v2h-1zM9 3h2v1H9zM12 2h1v3h-1zM10 5h1v2h-1zM13 6h2v1h-2zM15 4h1v2h-1zM16 1h1v2h-1z"></path>
          <path class="q" d="M0 9h2v1H0zM3 9h1v2H3zM1 11h2v1H1zM5 10h2v1H5zM0 13h1v2H0zM2 14h2v1H2zM4 12h1v2H4zM6 13h1v1H6zM1 16h2v1H1z"></path>
          <path class="q" d="M9 9h2v2H9zM12 9h1v1h-1zM14 9h2v1h-2zM17 9h1v2h-1zM19 9h1v1h-1zM21 10h2v1h-2zM23 9h1v2h-1z"></path>
          <path class="q" d="M9 12h1v2H9zM11 12h2v1h-2zM14 12h1v3h-1zM16 13h2v1h-2zM19 12h1v2h-1zM21 13h1v1h-1zM23 12h1v2h-1z"></path>
          <path class="q" d="M10 15h2v1h-2zM13 16h1v2h-1zM9 17h2v1H9zM15 15h1v2h-1zM17 16h2v1h-2zM20 15h1v2h-1zM22 16h2v1h-2z"></path>
          <path class="q" d="M9 19h1v2H9zM11 19h2v1h-2zM14 19h2v1h-2zM17 19h1v2h-1zM19 20h2v1h-2zM22 19h1v2h-1zM10 22h2v1h-2zM13 21h1v2h-1zM15 22h2v1h-2zM18 22h1v2h-1zM20 23h3v1h-3zM12 24h2v1h-2z"></path>
          <path class="q" d="M9 6h1v1H9zM16 8h1v1h-1zM8 16h1v1H8zM8 8h1v1H8z"></path>
        </svg>
      </div>
      <div style="font-size: 14px; color: #5C6672; margin-top: 18px">o dale este código</div>
      <div class="num" style="font-size: 36px; font-weight: 700; letter-spacing: 0.14em; margin-top: 6px">7K4M2P</div>
    </div>

    <!-- Acciones -->
    <div style="display: flex; gap: 8px">
      <div style="flex-grow: 1; height: 52px; border: 1px solid #DDE3E9; background: #FFFFFF; border-radius: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F1720" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        Copiar
      </div>
      <div style="flex-grow: 1; height: 52px; border: 1px solid #DDE3E9; background: #FFFFFF; border-radius: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0F1720" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"></path><path d="M7 8l5-5 5 5"></path><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path></svg>
        Compartir
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #DDE3E9; border-radius: 14px; padding: 15px 16px; display: flex; align-items: flex-start; gap: 11px">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#5C6672" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-5"></path><path d="M12 8h.01"></path></svg>
      <div style="font-size: 13px; color: #5C6672; line-height: 1.45">El código sirve una sola vez. Si alguien más lo usa antes, tendrás que generar otro.</div>
    </div>

  </div>

  <div style="flex: none; padding: 0 16px 8px 16px">
    <div style="display: flex; justify-content: center">
      <div style="width: 130px; height: 4px; border-radius: 2px; background: #0F1720; opacity: 0.25"></div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
