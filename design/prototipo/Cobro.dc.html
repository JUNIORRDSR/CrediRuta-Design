<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
  <style>
    *{ box-sizing: border-box; }
    body { margin: 0; background: #F5F7F9; color: #0F1720;
           font-family: Archivo, Roboto, "Helvetica Neue", Arial, sans-serif;
           font-size: 15px; line-height: 1.35; -webkit-font-smoothing: antialiased; }
    a { color: #0C6B8F; text-decoration: none; } a:hover { color: #08536F; }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -0.012em; }
    .cap { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #6C737B; display: flex; flex-direction: column; justify-content: flex-end">

  <!-- Fondo atenuado: la lista de ruta sigue detrás -->
  <div style="flex-grow: 1"></div>

  <!-- Hoja de cobro -->
  <div style="flex: none; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 20px 20px 20px">

    <div style="display: flex; justify-content: center">
      <div style="width: 40px; height: 4px; border-radius: 2px; background: #DDE3E9"></div>
    </div>

    <!-- Encabezado del cliente -->
    <div style="display: flex; align-items: center; gap: 12px; margin-top: 16px">
      <div style="width: 48px; height: 48px; flex: none; border-radius: 14px; background: #FBE7D4; color: #A9530B; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">MR</div>
      <div style="flex-grow: 1; min-width: 0">
        <div style="font-size: 18px; font-weight: 700; letter-spacing: -0.015em">María Restrepo</div>
        <div class="num" style="font-size: 13px; color: #5C6672; margin-top: 1px">Cuota $ 25.000 · saldo $ 300.000</div>
      </div>
    </div>

    <!-- Resultado de la visita -->
    <div style="margin-top: 20px">
      <div class="cap" style="color: #8A94A1">¿Qué pasó en la visita?</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px">
        <div style="height: 52px; border-radius: 12px; background: #0C6B8F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
          Pagó
        </div>
        <div style="height: 52px; border-radius: 12px; background: #FFFFFF; border: 1px solid #DDE3E9; color: #0F1720; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500">Abono parcial</div>
        <div style="height: 52px; border-radius: 12px; background: #FFFFFF; border: 1px solid #DDE3E9; color: #0F1720; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500">No pagó</div>
        <div style="height: 52px; border-radius: 12px; background: #FFFFFF; border: 1px solid #DDE3E9; color: #0F1720; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500">No estaba</div>
      </div>
    </div>

    <!-- Monto -->
    <div style="margin-top: 20px">
      <div class="cap" style="color: #8A94A1">Monto recibido</div>
      <div style="border: 2px solid #0C6B8F; border-radius: 14px; padding: 14px 16px; margin-top: 8px; display: flex; align-items: baseline; gap: 6px; background: #FFFFFF">
        <div class="num" style="font-size: 26px; font-weight: 600; color: #8A94A1">$</div>
        <div class="num" style="font-size: 34px; font-weight: 700; letter-spacing: -0.03em; flex-grow: 1">25.000</div>
        <div style="width: 2px; height: 34px; background: #0C6B8F"></div>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 10px">
        <div class="num" style="flex-grow: 1; height: 44px; border-radius: 10px; background: #DCEFF6; color: #08536F; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">Cuota 25.000</div>
        <div class="num" style="flex-grow: 1; height: 44px; border-radius: 10px; background: #F5F7F9; color: #0F1720; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500">Media 12.500</div>
        <div class="num" style="flex-grow: 1; height: 44px; border-radius: 10px; background: #F5F7F9; color: #0F1720; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500">Saldo total</div>
      </div>
    </div>

    <!-- Efecto del pago -->
    <div style="margin-top: 18px; background: #F5F7F9; border-radius: 12px; padding: 14px 16px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="font-size: 14px; color: #5C6672">Saldo después del pago</div>
        <div class="num" style="font-size: 16px; font-weight: 700">$ 275.000</div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 8px">
        <div style="font-size: 14px; color: #5C6672">Queda</div>
        <div class="num" style="font-size: 14px; font-weight: 600; color: #A9530B">2 cuotas atrás</div>
      </div>
    </div>

    <!-- Acción -->
    <div style="margin-top: 20px">
      <div style="height: 56px; border-radius: 14px; background: #0C6B8F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">Registrar pago de $ 25.000</div>
      <div style="height: 52px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #5C6672; margin-top: 4px">Cancelar</div>
    </div>

    <div style="height: 8px"></div>
    <div style="display: flex; justify-content: center">
      <div style="width: 130px; height: 4px; border-radius: 2px; background: #0F1720; opacity: 0.25"></div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
