<section class="screen" id="modoCarretera" data-nav="none">
  <div class="inset"></div>

  <div class="roadmap">
    <div class="map">
      <div class="map__road" style="left:0;top:34%;right:0;height:14px"></div>
      <div class="map__road" style="left:24%;top:0;bottom:0;width:12px"></div>
      <div class="map__road" style="left:0;top:72%;right:0;height:10px"></div>
      <div class="map__road" style="left:68%;top:0;bottom:0;width:10px"></div>
      <div class="map__pin map__pin--done" style="left:18%;top:20%">7</div>
      <div class="map__pin" style="left:60%;top:44%">8</div>
      <div class="map__pin" style="left:30%;top:62%">9</div>
    </div>

    <div class="roadmap__top">
      <button class="iconbtn iconbtn--float" type="button" data-back>
        <svg class="i"><use href="#i-back"></use></svg>
      </button>
      <div class="grow center">
        <span class="pill">
          <svg class="i i--sm"><use href="#i-nav"></use></svg>
          Modo carretera
        </span>
      </div>
      <button class="iconbtn iconbtn--float" type="button">
        <svg class="i"><use href="#i-pin"></use></svg>
      </button>
    </div>

    <div class="roadmap__card card">
      <div class="row">
        <span class="badge badge--dark">Siguiente</span>
        <div class="grow"></div>
        <span class="badge badge--orange">3 cuotas atrás</span>
      </div>

      <div class="spread mt12">
        <div class="grow">
          <div class="h2">María Restrepo</div>
          <div class="small">Cra 12 #4-30, Centro · a 320 m</div>
        </div>
        <div class="right none">
          <div class="h3 num">$ 25.000</div>
          <div class="small">cuota</div>
        </div>
      </div>

      <div class="cuotas mt16">
        <div class="cuota is-paid"></div><div class="cuota is-paid"></div>
        <div class="cuota is-paid"></div><div class="cuota is-paid"></div>
        <div class="cuota is-paid"></div><div class="cuota is-paid"></div>
        <div class="cuota is-paid"></div><div class="cuota is-paid"></div>
        <div class="cuota is-late"></div><div class="cuota is-late"></div>
        <div class="cuota is-late"></div><div class="cuota is-today"></div>
        <div class="cuota"></div><div class="cuota"></div><div class="cuota"></div>
        <div class="cuota"></div><div class="cuota"></div><div class="cuota"></div>
        <div class="cuota"></div><div class="cuota"></div>
      </div>

      <div class="row mt16">
        <button class="iconbtn iconbtn--soft" type="button">
          <svg class="i"><use href="#i-phone"></use></svg>
        </button>
        <button class="iconbtn iconbtn--soft" type="button">
          <svg class="i"><use href="#i-nav"></use></svg>
        </button>
        <button class="btn btn--primary btn--sm grow" type="button" data-sheet="sheetCobro">
          Registrar pago de $ 25.000
        </button>
      </div>
    </div>
  </div>
</section>
