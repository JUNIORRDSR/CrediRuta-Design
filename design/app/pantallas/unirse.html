<section class="screen" id="unirse" data-nav="none">
  <div class="inset"></div>

  <div class="topbar">
    <button class="iconbtn" type="button" data-back>
      <svg class="i"><use href="#i-back"></use></svg>
    </button>
    <div class="topbar__grow">
      <div class="topbar__title">Unirme a un equipo</div>
    </div>
  </div>

  <div class="body">

    <div class="h1">Escribe el código que te dieron</div>
    <div class="muted mt8">Son 6 letras y números. Te lo da el administrador de tu ruta.</div>

    <div class="field mt24">
      <div class="field__box">
        <input class="money__val num center" value="7K4M2P" placeholder="7K4M2P">
      </div>
    </div>

    <button class="btn btn--ghost mt16" type="button" data-toast="Equipo encontrado">Buscar equipo</button>

    <div class="card mt20">
      <div class="row">
        <div class="avatar avatar--indigo">CD</div>
        <div class="grow">
          <div class="h3">CrediRuta</div>
          <div class="small mt8">Carlos Duarte · Administrador</div>
        </div>
      </div>
      <div class="mt12">
        <div class="listrow">
          <div class="grow muted">Vas a entrar como</div>
          <div class="strong">Cobrador</div>
        </div>
        <div class="listrow">
          <div class="grow muted">Ruta asignada</div>
          <div class="strong">Ruta Sur</div>
        </div>
        <div class="listrow">
          <div class="grow muted">Clientes</div>
          <div class="strong num">18</div>
        </div>
      </div>
    </div>

    <button class="btn btn--primary mt20" type="button" data-go="ruta" data-toast="Bienvenido al equipo">Entrar al equipo</button>

    <button class="btn btn--soft btn--sm mt12" type="button">
      <svg class="i"><use href="#i-qr"></use></svg>
      Escanear código QR
    </button>

  </div>
</section>
