<section class="screen" id="invitacion" data-nav="none">
  <div class="inset"></div>

  <div class="topbar">
    <button class="iconbtn" type="button" data-back>
      <svg class="i"><use href="#i-close"></use></svg>
    </button>
    <div class="topbar__grow">
      <div class="topbar__title">Invitar cobrador</div>
    </div>
  </div>

  <div class="body">
    <div class="stack-16">

      <div class="card">
        <div class="lbl">Entra como</div>
        <div class="listrow">
          <div class="grow">Rol</div>
          <div class="strong none">Cobrador</div>
        </div>
        <div class="listrow">
          <div class="grow">Ruta asignada</div>
          <div class="strong none">Ruta Sur</div>
          <svg class="i i--sm"><use href="#i-down"></use></svg>
        </div>
        <div class="listrow">
          <div class="grow">El código vence</div>
          <div class="strong num none">en 3 días</div>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <div class="grow"></div>
          <div class="avatar" style="width:160px;height:160px;border-radius:24px">
            <svg class="i" style="width:96px;height:96px"><use href="#i-qr"></use></svg>
          </div>
          <div class="grow"></div>
        </div>
        <div class="small center mt16">o dale este código</div>
        <div class="h1 num center mt8">7K4M2P</div>
      </div>

      <div class="grid2">
        <button class="btn btn--ghost btn--sm" type="button" data-toast="Código copiado">
          <svg class="i"><use href="#i-copy"></use></svg>
          Copiar
        </button>
        <button class="btn btn--primary btn--sm" type="button" data-toast="Listo para compartir">
          <svg class="i"><use href="#i-share"></use></svg>
          Compartir
        </button>
      </div>

      <div class="alert alert--gray">
        <svg class="i"><use href="#i-info"></use></svg>
        <div class="grow">El código sirve una sola vez. Si alguien más lo usa antes, tendrás que generar otro.</div>
      </div>

    </div>
  </div>
</section>
